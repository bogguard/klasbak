name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pin actions to a commit SHA before going to production (supply-chain safety).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: npm run validate:infra
      - run: sam build --config-env dev
        working-directory: infra

  # Deployment (GitHub OIDC → AWS role, no stored keys) is added once the AWS accounts exist.
