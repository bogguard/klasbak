# Weekly update proposals; security fixes come right away (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for all minor/patch updates keeps the noise down; majors stay separate.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Lambda runtime (Node 24, see .nvmrc), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint doesn't support TypeScript 7 yet; remove when it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
