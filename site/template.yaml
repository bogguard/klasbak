AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Klasbak product site (klasbak.itrw.be): static pages in a private S3 bucket behind
  CloudFront. Separate from the school stacks; costs cents a month (see site/README.md).

Parameters:
  # The site's web address and its certificate in us-east-1, in Parameter Store like the app's
  # (scripts/request-certificate.sh <domain> /klasbak-site). "none" = the CloudFront address.
  DomainName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /klasbak-site/domain-name
  CertificateArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /klasbak-site/certificate-arn

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, none]]
    - !Not [!Equals [!Ref CertificateArn, none]]

Resources:
  # Everything in it is built from the repository (site/build.mjs), so nothing to keep on delete.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags:
        - { Key: project, Value: klasbak-site }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            # ListBucket makes missing pages a 404 instead of a 403.
            Action: [s3:GetObject, s3:ListBucket]
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              Bool: { aws:SecureTransport: false }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Folders serve their index.html (/en/ -> /en/index.html); /en without slash redirects.
  IndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-index
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for folders
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            return { statusCode: 301, statusDescription: 'Moved Permanently',
                     headers: { location: { value: uri + '/' } } };
          }
          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            # Everything comes from this site; the only third party is the YouTube player in
            # privacy-enhanced mode, loaded after a click.
            ContentSecurityPolicy: >-
              default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;
              media-src 'self'; font-src 'self'; connect-src 'self';
              frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self';
              form-action 'none'; object-src 'none'; upgrade-insecure-requests
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: strict-origin-when-cross-origin }
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} (Klasbak product site)
        HttpVersion: http2and3
        IPV6Enabled: true
        # Europe and North America edge locations only: cheapest, and our visitors are in Belgium.
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - { Key: project, Value: klasbak-site }

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  CloudFrontDomain:
    Description: Point the site's address here with a CNAME (e.g. bib -> d1234abcd.cloudfront.net).
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !If
      - HasCustomDomain
      - !Sub https://${DomainName}
      - !Sub https://${Distribution.DomainName}
