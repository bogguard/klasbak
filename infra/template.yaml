AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  School library app: web frontend (S3 + CloudFront), API (HTTP API + Lambda),
  data (DynamoDB), sign-in (Cognito) and monitoring. One stack per school and environment.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  # Read from SSM Parameter Store so no personal address lives in this (public) repository.
  # Create it once per account: see README, "First deploy".
  AlarmEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /library/alarm-email
    Description: Name of the SSM parameter holding the address for alarm and budget notifications.
  MonthlyBudgetUsd:
    Type: Number
    Default: 0
    Description: Monthly AWS cost budget for the whole account; 0 creates no budget.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasBudget: !Not [!Equals [!Ref MonthlyBudgetUsd, 0]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 10
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: !If [IsProd, INFO, DEBUG]
      SystemLogLevel: WARN
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        WEB_BUCKET: !Ref WebBucket
        POWERTOOLS_SERVICE_NAME: library
        POWERTOOLS_METRICS_NAMESPACE: Library
        NODE_OPTIONS: --enable-source-maps
    Tags:
      project: library
      environment: !Ref Environment

Resources:
  # ---------------------------------------------------------------- Data

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      # Keys only: the search indexer uses changes as a trigger and reads the table itself.
      StreamSpecification:
        StreamViewType: KEYS_ONLY
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      Tags:
        - { Key: project, Value: library }
        - { Key: environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- Sign-in

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub library-${Environment}
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      # The school creates accounts; nobody can sign themselves up.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # Usernames are member numbers (pupils often have no email address).
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 14
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolTags:
        project: library
        environment: !Ref Environment

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: admin, Precedence: 0 }
  LibrarianGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: librarian, Precedence: 1 }
  TeacherGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: teacher, Precedence: 2 }
  ReaderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: reader, Precedence: 3 }

  # ---------------------------------------------------------------- API

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # No IP addresses or paths: they can identify pupils (privacy by design).
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Catalogue API (titles, copies, ISBN lookup)
      CodeUri: ../services/api
      Handler: handler.handler
      LoggingConfig:
        LogGroup: !Ref CatalogLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${WebBucket.Arn}/covers/*
      Events:
        PublicTitle:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/catalog/public/titles/{id}
            Method: GET
            Auth:
              Authorizer: NONE
        Staff:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/catalog/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node24
        Minify: true
        Sourcemap: true
        OutExtension: [.js=.mjs]
        EntryPoints: [src/catalog/handler.ts]
        # Some CommonJS dependencies still call require(); this makes it available in ESM output.
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  CatalogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  SearchIndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Rebuilds the public search index when titles change
      CodeUri: ../services/api
      Handler: handler.handler
      MemorySize: 1024
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref SearchIndexerLogGroup
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${WebBucket.Arn}/search/*
        - SQSSendMessagePolicy: { QueueName: !GetAtt SearchIndexerDlq.QueueName }
      Events:
        TitleChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Table.StreamArn
            StartingPosition: LATEST
            BatchSize: 1000
            MaximumBatchingWindowInSeconds: 60
            MaximumRetryAttempts: 3
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"sk":{"S":["TITLE"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt SearchIndexerDlq.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node24
        Minify: true
        Sourcemap: true
        OutExtension: [.js=.mjs]
        EntryPoints: [src/search-indexer/handler.ts]
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  SearchIndexerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  SearchIndexerDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # ---------------------------------------------------------------- Web hosting

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags:
        - { Key: project, Value: library }
        - { Key: environment, Value: !Ref Environment }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            # ListBucket makes missing files a 404 instead of a 403.
            Action: [s3:GetObject, s3:ListBucket]
            Resource: [!GetAtt WebBucket.Arn, !Sub '${WebBucket.Arn}/*']
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt WebBucket.Arn, !Sub '${WebBucket.Arn}/*']
            Condition:
              Bool: { aws:SecureTransport: false }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub library-${Environment}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Serves index.html for app routes like /titles/123 (paths without a file extension).
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub library-${Environment}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite app routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var lastSegment = request.uri.split('/').pop();
          if (lastSegment.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub library-${Environment}-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            # Inline styles are allowed because UI libraries set positioning via style attributes.
            # The extra image hosts are only used by staff to preview a cover found by ISBN
            # lookup; the public catalogue only shows covers from our own bucket (decision 008).
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
              img-src 'self' data: https://covers.openlibrary.org https://archive.org https://*.archive.org https://books.google.com https://books.googleusercontent.com;
              font-src 'self';
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com;
              frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: strict-origin-when-cross-origin }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub library-${Environment}
        HttpVersion: http2and3
        # Europe and North America edge locations only: cheapest, and our users are in Belgium.
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
      Tags:
        - { Key: project, Value: library }
        - { Key: environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- Monitoring

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Handlers turn errors into HTTP 500s, so server errors show up here rather than as Lambda errors.
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API returned server errors. Check the CatalogFunction logs.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
        - { Name: Stage, Value: $default }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  SearchIndexerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rebuilding the search index failed; the public catalogue may be outdated.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref SearchIndexerFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SearchIndexerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Search index updates gave up after retries. Inspect the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt SearchIndexerDlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub library-${Environment}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlarmEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlarmEmail }

Outputs:
  AppUrl:
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref Table
