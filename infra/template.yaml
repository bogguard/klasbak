AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Klasbak, practical tools for a school (the school library first): web frontend (S3 + CloudFront), API (HTTP API + Lambda),
  data (DynamoDB), sign-in (Cognito) and monitoring. One stack per school and environment.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  # Read from SSM Parameter Store so no personal address lives in this (public) repository.
  # Create it once per account: see README, "First deploy".
  AlarmEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /klasbak/alarm-email
    Description: Name of the SSM parameter holding the address for alarm and budget notifications.
  MonthlyBudgetUsd:
    Type: Number
    Default: 0
    Description: Monthly AWS cost budget for the whole account; 0 creates no budget.
  # The school's own web address (e.g. bib.school.be) and its certificate in us-east-1, kept in
  # Parameter Store so no school details live in this repository. "none" = use the
  # CloudFront address. Set them with scripts/request-certificate.sh.
  DomainName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /klasbak/domain-name
  CertificateArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /klasbak/certificate-arn

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasBudget: !Not [!Equals [!Ref MonthlyBudgetUsd, 0]]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, none]]
    - !Not [!Equals [!Ref CertificateArn, none]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 10
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: !If [IsProd, INFO, DEBUG]
      SystemLogLevel: WARN
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        WEB_BUCKET: !Ref WebBucket
        USER_POOL_ID: !Ref UserPool
        # Staff must use two-step verification; the API checks it (services/api/src/lib/mfa.ts).
        STAFF_MFA_REQUIRED: 'true'
        POWERTOOLS_SERVICE_NAME: klasbak
        POWERTOOLS_METRICS_NAMESPACE: Klasbak
        NODE_OPTIONS: --enable-source-maps
    Tags:
      project: klasbak
      environment: !Ref Environment

Resources:
  # ---------------------------------------------------------------- Data

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      # Keys only: the search indexer uses changes as a trigger and reads the table itself.
      StreamSpecification:
        StreamViewType: KEYS_ONLY
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      # Lists: all readers sorted by class and name; active loans sorted by due date (sparse).
      # Key design: services/api/src/lib/keys.ts
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: project, Value: klasbak }
        - { Key: environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- Sign-in

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub klasbak-${Environment}
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      # The school creates accounts; nobody can sign themselves up.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # Usernames are member numbers (pupils often have no email address).
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          # Length beats complexity rules (NIST); staff also need two-step verification.
          MinimumLength: 12
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 14
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolTags:
        project: klasbak
        environment: !Ref Environment

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      # Users may not change their own attributes with their token (e.g. their email address,
      # which a stolen session could use to take over password recovery). Admins do it via
      # the app. Cognito needs at least one writable attribute; locale is harmless and unused.
      WriteAttributes: [locale]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: admin, Precedence: 0 }
  LibrarianGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: librarian, Precedence: 1 }
  TeacherGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: teacher, Precedence: 2 }
  ReaderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: reader, Precedence: 3 }

  # ---------------------------------------------------------------- API

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # No IP addresses or paths: they can identify pupils (privacy by design).
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Catalogue API (titles, copies, ISBN lookup)
      # Bundled by scripts/build-api.mjs (npm run build:api) before deploying.
      CodeUri: ../services/api/dist/catalog
      Handler: handler.handler
      LoggingConfig:
        LogGroup: !Ref CatalogLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:DeleteObject]
              Resource: !Sub ${WebBucket.Arn}/covers/*
            # Optional Google Books API key for ISBN lookups (README, "Book data").
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/klasbak/google-books-api-key
      Events:
        PublicTitle:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/catalog/public/titles/{id}
            Method: GET
            Auth:
              Authorizer: NONE
        Staff:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/catalog/{proxy+}
            Method: ANY

  CatalogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  ReadersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Readers API (pupils and teachers, CSV import)
      CodeUri: ../services/api/dist/readers
      Handler: handler.handler
      # Imports write up to 50 readers per request.
      Timeout: 25
      LoggingConfig:
        LogGroup: !Ref ReadersLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Staff:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/readers/{proxy+}
            Method: ANY
        StaffRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/readers
            Method: ANY

  ReadersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  CirculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Lending desk (scan, check-out, check-in), loans and settings
      CodeUri: ../services/api/dist/circulation
      Handler: handler.handler
      LoggingConfig:
        LogGroup: !Ref CirculationLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        # The library's name and logo, published as public files.
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:DeleteObject]
              Resource: !Sub ${WebBucket.Arn}/branding/*
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Staff:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/circulation/{proxy+}
            Method: ANY

  CirculationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  StaffFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Staff accounts (admins only) in Cognito
      CodeUri: ../services/api/dist/staff
      Handler: handler.handler
      LoggingConfig:
        LogGroup: !Ref StaffLogGroup
      Policies:
        # Audit entries are written to the table.
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminUserGlobalSignOut
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminSetUserMFAPreference
              Resource: !GetAtt UserPool.Arn
      Events:
        Admin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/staff/{proxy+}
            Method: ANY
        AdminRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/staff
            Method: ANY

  StaffLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  RetentionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Daily removal of old reading history (privacy), kept as anonymous counts
      CodeUri: ../services/api/dist/retention
      Handler: handler.handler
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref RetentionLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 3 * * ? *)
            ScheduleExpressionTimezone: Europe/Brussels
            RetryPolicy:
              MaximumRetryAttempts: 2

  RetentionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  SearchIndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Rebuilds the public search index when titles change
      CodeUri: ../services/api/dist/search-indexer
      Handler: handler.handler
      MemorySize: 1024
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref SearchIndexerLogGroup
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${WebBucket.Arn}/search/*
        - SQSSendMessagePolicy: { QueueName: !GetAtt SearchIndexerDlq.QueueName }
      Events:
        TitleChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Table.StreamArn
            StartingPosition: LATEST
            # No waiting: a change is indexed within seconds. Changes arriving while a rebuild
            # runs are picked up together by the next one, so bursts still coalesce.
            BatchSize: 1000
            MaximumRetryAttempts: 3
            FilterCriteria:
              Filters:
                # Titles and copies (copies change status on every loan): availability in search.
                - Pattern: '{"dynamodb":{"Keys":{"sk":{"S":["TITLE",{"prefix":"COPY#"}]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt SearchIndexerDlq.Arn

  SearchIndexerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  SearchIndexerDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # ---------------------------------------------------------------- Web hosting

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags:
        - { Key: project, Value: klasbak }
        - { Key: environment, Value: !Ref Environment }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            # ListBucket makes missing files a 404 instead of a 403.
            Action: [s3:GetObject, s3:ListBucket]
            Resource: [!GetAtt WebBucket.Arn, !Sub '${WebBucket.Arn}/*']
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt WebBucket.Arn, !Sub '${WebBucket.Arn}/*']
            Condition:
              Bool: { aws:SecureTransport: false }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub klasbak-${Environment}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Serves index.html for app routes like /titles/123 (paths without a file extension).
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub klasbak-${Environment}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite app routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var lastSegment = request.uri.split('/').pop();
          if (lastSegment.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub klasbak-${Environment}-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            # Inline styles are allowed because UI libraries set positioning via style attributes.
            # 'wasm-unsafe-eval' lets the camera barcode reader run WebAssembly (no JS eval).
            # The extra image hosts are only used by staff to preview a cover found by ISBN
            # lookup; the public catalogue only shows covers from our own bucket (decision 008).
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline';
              img-src 'self' data: https://covers.openlibrary.org https://archive.org https://*.archive.org https://books.google.com https://books.googleusercontent.com;
              font-src 'self';
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com;
              frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: strict-origin-when-cross-origin }
        CustomHeadersConfig:
          Items:
            # Only the camera, and only for our own pages (barcode scanning at the desk).
            - Header: Permissions-Policy
              Override: true
              Value: camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
            - Header: Cross-Origin-Opener-Policy
              Override: true
              Value: same-origin

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub klasbak-${Environment}
        HttpVersion: http2and3
        # Europe and North America edge locations only: cheapest, and our users are in Belgium.
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
      Tags:
        - { Key: project, Value: klasbak }
        - { Key: environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- Monitoring

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Handlers turn errors into HTTP 500s, so server errors show up here rather than as Lambda errors.
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        The API returned server errors. Open the dashboard and the "Errors and warnings" query in
        CloudWatch Logs Insights (docs/runbook.md).
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
        - { Name: Stage, Value: $default }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  SearchIndexerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rebuilding the search index failed; the public catalogue may be outdated.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref SearchIndexerFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  RetentionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Removing old reading history failed; personal data may be kept too long.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref RetentionFunction }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SearchIndexerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Search index updates gave up after retries. Inspect the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt SearchIndexerDlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A function was throttled (account concurrency limit): requests were refused or delayed.
  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda functions were throttled; users may have seen errors (docs/runbook.md).
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Failing runs are caught above; this catches the nightly job not running at all (privacy:
  # reading history must be removed after the retention period).
  RetentionNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The nightly removal of old reading history did not run for two days (docs/runbook.md).
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - { Name: FunctionName, Value: !Ref RetentionFunction }
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # One page to see how the installation is doing (free: up to three dashboards per account).
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub klasbak-${Environment}
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              { "type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": { "markdown": "## Klasbak (${Environment})  \nAlarms go to the address in Parameter Store (/klasbak/alarm-email). What to do per alarm: docs/runbook.md in the repository." } },
              { "type": "alarm", "x": 0, "y": 2, "width": 24, "height": 3, "properties": { "title": "Alarms", "alarms": [ "${ApiAlarm}", "${IndexerAlarm}", "${RetentionAlarm}", "${DlqAlarm}", "${ThrottlesAlarm}", "${RetentionRunAlarm}" ] } },
              { "type": "metric", "x": 0, "y": 5, "width": 12, "height": 6, "properties": { "title": "API requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "metrics": [ [ "AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", "Stage", "$default", { "label": "requests" } ], [ ".", "4xx", ".", ".", ".", ".", { "label": "4xx (refused, e.g. validation)" } ], [ ".", "5xx", ".", ".", ".", ".", { "label": "5xx (server errors)", "color": "#d62728" } ] ] } },
              { "type": "metric", "x": 12, "y": 5, "width": 12, "height": 6, "properties": { "title": "API response time (ms)", "region": "${AWS::Region}", "period": 300, "metrics": [ [ "AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", "Stage", "$default", { "stat": "p50", "label": "median" } ], [ "...", { "stat": "p95", "label": "95th percentile" } ] ] } },
              { "type": "metric", "x": 0, "y": 11, "width": 12, "height": 6, "properties": { "title": "Function errors and throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "metrics": [ [ { "expression": "SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Errors\" klasbak-${Environment}', 'Sum', 300)", "label": "", "id": "errors" } ], [ "AWS/Lambda", "Throttles", { "label": "throttles" } ], [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DlqName}", { "stat": "Maximum", "label": "search index dead-letter queue" } ] ] } },
              { "type": "metric", "x": 12, "y": 11, "width": 12, "height": 6, "properties": { "title": "Library activity per day", "region": "${AWS::Region}", "stat": "Sum", "period": 86400, "view": "bar", "metrics": [ [ { "expression": "SEARCH('{Klasbak,service} MetricName=\"LoanCreated\" OR MetricName=\"LoanReturned\" OR MetricName=\"LoanReturnedOverdue\" OR MetricName=\"TitleCreated\" OR MetricName=\"ReaderCreated\"', 'Sum', 86400)", "label": "", "id": "activity" } ] ] } },
              { "type": "log", "x": 0, "y": 17, "width": 24, "height": 8, "properties": { "title": "Latest errors and warnings", "region": "${AWS::Region}", "view": "table", "query": "SOURCE '${CatalogLogs}' | SOURCE '${ReadersLogs}' | SOURCE '${CirculationLogs}' | SOURCE '${StaffLogs}' | SOURCE '${RetentionLogs}' | SOURCE '${IndexerLogs}' | fields @timestamp, level, message, function_name, error.message, function_request_id | filter level in ['ERROR', 'WARN'] | sort @timestamp desc | limit 50" } }
            ]
          }
        - ApiAlarm: !GetAtt ApiServerErrorsAlarm.Arn
          IndexerAlarm: !GetAtt SearchIndexerErrorsAlarm.Arn
          RetentionAlarm: !GetAtt RetentionErrorsAlarm.Arn
          DlqAlarm: !GetAtt SearchIndexerDlqAlarm.Arn
          ThrottlesAlarm: !GetAtt LambdaThrottlesAlarm.Arn
          RetentionRunAlarm: !GetAtt RetentionNotRunningAlarm.Arn
          DlqName: !GetAtt SearchIndexerDlq.QueueName
          CatalogLogs: !Ref CatalogLogGroup
          ReadersLogs: !Ref ReadersLogGroup
          CirculationLogs: !Ref CirculationLogGroup
          StaffLogs: !Ref StaffLogGroup
          RetentionLogs: !Ref RetentionLogGroup
          IndexerLogs: !Ref SearchIndexerLogGroup

  # Ready-made searches in CloudWatch Logs Insights (free to keep; a search costs fractions of a cent).
  ErrorsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub klasbak-${Environment}/Errors and warnings
      LogGroupNames:
        [
          !Ref CatalogLogGroup,
          !Ref ReadersLogGroup,
          !Ref CirculationLogGroup,
          !Ref StaffLogGroup,
          !Ref RetentionLogGroup,
          !Ref SearchIndexerLogGroup,
        ]
      QueryString: |
        fields @timestamp, level, message, function_name, error.name, error.message, function_request_id
        | filter level in ['ERROR', 'WARN']
        | sort @timestamp desc
        | limit 100

  ReferenceQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub klasbak-${Environment}/Find an error by its reference
      LogGroupNames:
        [
          !Ref CatalogLogGroup,
          !Ref ReadersLogGroup,
          !Ref CirculationLogGroup,
          !Ref StaffLogGroup,
          !Ref RetentionLogGroup,
          !Ref SearchIndexerLogGroup,
        ]
      QueryString: |
        # Replace REFERENCE by the code the user saw ("referentie: ..."), or the first characters of it.
        fields @timestamp, level, message, function_name, error.name, error.message, error.stack
        | filter function_request_id like 'REFERENCE'
        | sort @timestamp asc

  SlowRequestsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub klasbak-${Environment}/Slow requests
      LogGroupNames:
        [!Ref CatalogLogGroup, !Ref ReadersLogGroup, !Ref CirculationLogGroup, !Ref StaffLogGroup]
      QueryString: |
        fields @timestamp, method, route, status, durationMs, function_name
        | filter message = 'request' and durationMs > 1000
        | sort durationMs desc
        | limit 50

  TrafficQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub klasbak-${Environment}/Requests per route and status
      LogGroupNames:
        [!Ref CatalogLogGroup, !Ref ReadersLogGroup, !Ref CirculationLogGroup, !Ref StaffLogGroup]
      QueryString: |
        filter message = 'request'
        | stats count() as requests, avg(durationMs) as avgMs, max(durationMs) as maxMs by method, route, status
        | sort requests desc

  IsbnSourcesQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub klasbak-${Environment}/ISBN sources failing
      LogGroupNames: [!Ref CatalogLogGroup]
      QueryString: |
        filter message = 'isbn source failed'
        | stats count() as failures, latest(error.message) as lastError by source
        | sort failures desc

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub klasbak-${Environment}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlarmEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlarmEmail }

Outputs:
  DashboardUrl:
    Description: How the installation is doing (CloudWatch dashboard)
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/klasbak-${Environment}
  AppUrl:
    Value: !If
      - HasCustomDomain
      - !Sub https://${DomainName}
      - !Sub https://${Distribution.DomainName}
  # The school's DNS points its own address here (a CNAME record).
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref Table
